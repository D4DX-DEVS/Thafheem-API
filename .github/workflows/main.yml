name: Deploy to Production

on:
  push:
    branches:
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 5317
          command_timeout: 10m
          script: |
            set -e
            
            # Load NVM
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            
            APP_DIR="/home/thafheem/public_html/Thafheem-API"
            cd "$APP_DIR"
            
            echo "🚀 Starting deployment..."
            echo "Node: $(node --version) | NPM: $(npm --version) | PM2: $(pm2 --version)"
            echo ""
            
            # ============================================
            # 1. Update Code
            # ============================================
            echo "📦 Updating code..."
            git config --global --add safe.directory "$APP_DIR"
            
            if [ ! -d .git ]; then
              git init
              git remote add origin https://${{ secrets.GH_PAT }}@github.com/D4DX-DEVS/Thafheem-API.git
            else
             git remote set-url origin https://${{ secrets.GH_PAT }}@github.com/D4DX-DEVS/Thafheem-API.git
            fi
            
            git fetch origin production
            git checkout -B production origin/production
            git clean -fd -e .env

            
            # ============================================
            # 2. Install Dependencies
            # ============================================
            echo ""
            echo "📚 Installing dependencies..."
            npm ci --omit=dev --quiet
            
            # ============================================
            # 3. Graceful Restart
            # ============================================
            echo ""
            echo "🔄 Restarting application..."
            
            if pm2 describe thafheem-backend > /dev/null 2>&1; then
              # App exists - use PM2 restart (triggers graceful shutdown)
              pm2 restart thafheem-backend --update-env
              
              # Wait for graceful shutdown to complete (max 35s)
              echo "⏳ Waiting for graceful shutdown..."
              sleep 5
              
              # Verify restart succeeded
              if ! pm2 describe thafheem-backend 2>/dev/null | grep -q "status.*online"; then
                echo "❌ Restart failed, checking for port conflicts..."
                
                # Emergency cleanup only if restart failed
                if command -v lsof >/dev/null 2>&1; then
                  PIDS=$(lsof -ti:5000 2>/dev/null || true)
                  if [ -n "$PIDS" ]; then
                    echo "⚠️  Killing zombie processes: $PIDS"
                    echo "$PIDS" | xargs kill -9 2>/dev/null || true
                    sleep 2
                  fi
                fi
                
                # Try starting fresh
                pm2 delete thafheem-backend || true
                pm2 start server.js --name "thafheem-backend" --time --max-memory-restart 500M
              fi
            else
              # First deployment - start fresh
              pm2 start server.js \
                --name "thafheem-backend" \
                --time \
                --max-memory-restart 500M \
                --log-date-format "YYYY-MM-DD HH:mm:ss Z" \
                --merge-logs
            fi
            
            # ============================================
            # 4. Verify & Save
            # ============================================
            echo ""
            echo "✅ Verifying deployment..."
            sleep 2
            
            if pm2 describe thafheem-backend 2>/dev/null | grep -q "status.*online"; then
              pm2 save --force
              echo ""
              echo "✅ Deployment successful!"
              pm2 status
              echo ""
              echo "📋 Recent logs:"
              pm2 logs thafheem-backend --lines 15 --nostream
            else
              echo "❌ Deployment failed - app not running"
              pm2 logs thafheem-backend --lines 30 --nostream
              exit 1
            fi